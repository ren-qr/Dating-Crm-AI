services:
  postgres:
    image: postgres:16-alpine
    container_name: date_manage_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: date_manage
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - date_manage_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d date_manage"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  date_manage_postgres_data:
